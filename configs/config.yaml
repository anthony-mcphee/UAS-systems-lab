# ============================================================
# Beacon Follower — Configuration
# ============================================================

connection:
  # Hardware (SiK ground radio on COM4 via WSL serial passthrough):
  uri: "serial:///dev/ttyS4:57600"
  # SITL (MAVProxy UDP output):
  # uri: "udpin:127.0.0.1:14551"

home:
  lat: 21.2969
  lon: -157.7228

altitudes:
  takeoff: 20        # meters AGL
  follow: 20         # cruise altitude while tracking
  descend_high: 12   # first descent waypoint
  descend_low: 5     # second descent waypoint before land

follow:
  radius_m: 8        # distance threshold to consider "over beacon"
  update_rate_sec: 1 # main loop interval

beacon:
  # Source options: "simulate" | "udp" | "serial"
  source: "simulate"

  # UDP settings (used when source = "udp")
  udp:
    host: "0.0.0.0"
    port: 5005

  # Serial/NMEA settings (used when source = "serial")
  serial:
    port: "/dev/ttyUSB0"
    baudrate: 9600

logging:
  log_dir: "logs"
  level: "INFO"       # DEBUG | INFO | WARNING | ERROR
